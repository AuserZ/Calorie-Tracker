<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Eat·en — redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FFF6E6;
    --cream-2:#FBEBCB;
    --ink:#15140F;
    --ink-2:#3A372E;
    --ink-soft:#7A7565;
    --line:rgba(21,20,15,.10);
    --surface:#FFFDF8;
    --blue:#2E5BFF;
    --blue-2:#5B7FFF;
    --tang:#FF6A1A;
    --tang-2:#FFA245;
    --lime:#C8E84A;
    --plum:#3F0F47;
    --good:#1FB36B;
    --warn:#F2A33A;
    --bad:#E64646;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#E9DEC9;color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;overflow:hidden}
  .serif{font-family:'Instrument Serif',ui-serif,Georgia,serif;font-weight:400;letter-spacing:-0.01em}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  button{font-family:inherit}

  /* tabular nums everywhere it counts */
  .tnum{font-variant-numeric:tabular-nums}

  /* page-level scroll inside frames only */
  .frame-scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .frame-scroll::-webkit-scrollbar{width:0;height:0}

  /* utility: float blob bg */
  @keyframes blob1{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(30px,-20px) scale(1.08)}
    66%{transform:translate(-20px,25px) scale(0.95)}
  }
  @keyframes blob2{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-25px,30px) scale(1.1)}
  }
  @keyframes spinSlow{ to{transform:rotate(360deg)} }
  @keyframes pulseRing{
    0%{transform:scale(1);opacity:.6}
    100%{transform:scale(1.6);opacity:0}
  }
  @keyframes shine{
    0%{transform:translateX(-110%)}
    60%,100%{transform:translateX(110%)}
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
  }
  @keyframes drift{
    0%{transform:translate3d(0,0,0)}
    100%{transform:translate3d(-50%,0,0)}
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }
  @keyframes scaleIn{
    from{opacity:0;transform:scale(.92)}
    to{opacity:1;transform:scale(1)}
  }
  @keyframes wiggleFork{
    0%,100%{transform:rotate(-6deg)}
    50%{transform:rotate(6deg)}
  }
  @keyframes confettiFall{
    0%{transform:translate3d(var(--cx,0),-20px,0) rotate(0);opacity:1}
    100%{transform:translate3d(calc(var(--cx,0) + var(--dx,40px)),120vh,0) rotate(720deg);opacity:0}
  }
  @keyframes shimmer{
    0%{background-position:-200% 0}
    100%{background-position:200% 0}
  }
  @keyframes ringDraw{
    from{stroke-dasharray:0 9999}
  }
  @keyframes liquidWave{
    0%{transform:translateX(0)}
    100%{transform:translateX(-50%)}
  }
  @keyframes scanline{
    0%{top:0%}
    100%{top:100%}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:1ms !important; transition-duration:1ms !important}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>

</body>
</html>
